defaults:
  - _self_

_target_: ood_slam.data.image_seq_rpe_datamodule.ImageSequenceErrorDataModule

# Staging dir (set by SLURM)
data_dir: "${get_constant:SLURM_TMPDIR}" 

# SPLITS: Point to text files!
# Create these files in your project root or a splits/ folder
train_sequences: "${hydra:runtime.cwd}/splits/tartanair_train.txt"
valid_sequences: "${hydra:runtime.cwd}/splits/tartanair_val.txt"

# Dataset Type 
dataset_type: "tartanair"

# Image Params (TartanAir is 640x480)
# We use 320x256 to satisfy the "Power of 64" constraint (DeepVO)
# while roughly preserving the 4:3 aspect ratio
img_w: 320
img_h: 256
img_means: [0.485, 0.456, 0.406]
img_stds: [0.229, 0.224, 0.225]
resize_mode: "rescale"
minus_point_5: false

# Sequence parameters
seq_len: [5, 5] 
sample_times: 1

# Caching settings
use_cache: true
cache_dir: null  # Will use default: {data_dir}/datainfo

# DataLoader settings
batch_size: ${batch_size}
num_workers: 4
pin_memory: true
use_cache: true
overfit: false
task: "regression"